name: Weekly Calendar Magazine

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-weekly-digest:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-service-account.json
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
      DAYS_AHEAD: ${{ vars.DAYS_AHEAD || '7' }}
      MAGAZINE_TITLE: ${{ vars.MAGAZINE_TITLE || 'The Week Ahead' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure Google service account
        env:
          GOOGLE_APPLICATION_JSON: ${{ secrets.GOOGLE_APPLICATION_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ.get("GOOGLE_APPLICATION_JSON", "")
          if not raw:
              raise SystemExit("Set the GOOGLE_APPLICATION_JSON repository secret.")
          path = Path(os.environ["GOOGLE_APPLICATION_CREDENTIALS"])
          path.write_text(raw, encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Send weekly digest
        run: python app.py
